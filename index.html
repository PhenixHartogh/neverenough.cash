<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Never Enough Terminal</title>

<style>
body{
    background:#000;
    color:#00ff00;
    font-family: monospace;
    margin:0;
}

#console{
    height:90vh;
    overflow-y:auto;
    padding:10px;
}

#input-line{
    border-top:1px solid #00ff00;
    padding:10px;
}

#command{
    width:100%;
    background:black;
    color:#00ff00;
    border:none;
    outline:none;
    font-family: monospace;
    font-size:16px;
}
</style>

</head>

<body>

<div id="console">
Never Enough Terminal v1.0<br>
type "help" to begin<br><br>
</div>

<div id="input-line">
<input id="command" autofocus autocomplete="off">
</div>

<script src="terminal.js"></script>

</body>
</html>
